services:
  - type: web
    name: shiv-ai-server
    env: docker
    plan: free
    region: oregon
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SHIV_AUTH_JWT_SECRET
        value: shiv-platform-super-secret-jwt-key-2026-production
